[package]
name = "sound-memory"
version = "0.1.0"
edition = "2021"
description = "Remembers and restores the system volume of Bluetooth audio devices on Windows"
license = "MIT"

[dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[dependencies.windows-core]
version = "0.62.2"

[dependencies.eframe]
version = "0.37"
default-features = false
features = ["glow", "default_fonts"]

[profile.release]
opt-level = "z"
codegen-units = 1
lto = true
panic = "abort"
strip = true
